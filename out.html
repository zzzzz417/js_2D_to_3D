function clear(){
    ctx.fillStyle = BACKGROUND

function point({x, y}){
    let s = 10
    ctx.fillStyle = FRONTGROUND
    ctx.fillRect(x - s/2,y - s/2,s,s)
}

function screen(p){
    return {
        x : (p.x + 1)/2*game.width,
        y : (1 - (p.y + 1)/2)*game.height,
    }
}

function project({x,y,z}){
    return{
        x : x/z,
        y : y/z,
    }
}

function rotate_xz({x,y,z},angle){
    const c = Math.cos(angle)
    const s = Math.sin(angle)
    return{
        x : x*c - z*s,
        y : y,
        z : x*s + z*c,
    }
}



function translate_z({x,y,z},dz){
    return{ x : x,y: y ,z : z + dz }
}
function translate_y({x,y,z},dy){
    return{ x : x,y: y + dy ,z : z }
}
function translate_x({x,y,z},dx){
    return{ x : x + dx,y: y ,z : z  }
}

function line(p1,p2){
    ctx.strokeStyle = FRONTGROUND
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
}

            line(
            screen(project((translate_z(rotate_xz(a,angle),Math.abs(dz))))),
            screen(project((translate_z(rotate_xz(b,angle),Math.abs(dz)))))
            )
        }
    }

    setTimeout(farme, 1000/FPS)
}

setTimeout(farme, 1000/FPS)


</script>
